services:
  mysql:
    image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin"]
    environment:
      MYSQL_DATABASE: labelstudio_ci
      MYSQL_USER: labelstudio
      MYSQL_PASSWORD: ci-only-mysql-password
      MYSQL_ROOT_PASSWORD: ci-only-mysql-root
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql -uroot -h127.0.0.1 --batch --skip-column-names -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
  label-studio:
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DJANGO_DB: mysql
      MYSQL_NAME: labelstudio_ci
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: labelstudio
      MYSQL_PASSWORD: ci-only-mysql-password
